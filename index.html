<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | To-Do Web App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <section class="app-card">

            <header class="app-header">
                <div>
                    <p class="eyebrow">SKILLCRAFT TECHNOLOGY · TASK 04</p>
                    <h1>TaskFlow</h1>
                    <p class="subtitle">
                        Organize your tasks. Manage your time. Get things done.
                    </p>
                </div>

                <div class="task-summary">
                    <span id="taskCount">0</span>
                    <small>Tasks</small>
                </div>
            </header>


            <section class="task-input-section">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    maxlength="100"
                >

                <input
                    type="date"
                    id="taskDate"
                >

                <input
                    type="time"
                    id="taskTime"
                >

                <button id="addTaskBtn">
                    + Add Task
                </button>

            </section>


            <section class="toolbar">

                <div class="filters">
                    <button class="filter-btn active" data-filter="all">
                        All
                    </button>

                    <button class="filter-btn" data-filter="active">
                        Active
                    </button>

                    <button class="filter-btn" data-filter="completed">
                        Completed
                    </button>
                </div>

                <button id="clearCompletedBtn" class="clear-btn">
                    Clear Completed
                </button>

            </section>


            <section id="taskList" class="task-list">
                <!-- Tasks will appear here -->
            </section>


            <div id="emptyState" class="empty-state">
                <div class="empty-icon">✓</div>
                <h2>No tasks yet</h2>
                <p>Add your first task and start organizing your day.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
